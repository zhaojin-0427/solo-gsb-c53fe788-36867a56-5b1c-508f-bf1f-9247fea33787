services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: mails
      POSTGRES_PASSWORD: mails
      POSTGRES_DB: mails
    # tuned for the 2 vCPU / 1 GiB target container: the API process and
    # PostgreSQL share the 1 GiB budget.
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - effective_cache_size=384MB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - max_connections=40
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mails -d mails"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://mails:mails@db:5432/mails
    ports:
      - "8000:8000"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1024M

volumes:
  pgdata:
